[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshou"
dynamic = ["version"]
description = "A Library for Deep Reinforcement Learning"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "TSAIL", email = "trinkle23897@gmail.com"}
]
maintainers = [
    {name = "TSAIL", email = "trinkle23897@gmail.com"}
]
keywords = ["reinforcement learning", "deep learning", "pytorch", "gymnasium", "rl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepdiff>=7.0.1,<8.0.0",
    "gymnasium>=0.28.0,<0.29.0",
    "h5py>=3.9.0,<4.0.0",
    "matplotlib>=3.0.0",
    "numba>=0.60.0",
    "numpy>=1,<2",
    "overrides>=7.4.0,<8.0.0",
    "packaging",
    "pandas>=2.0.0",
    "pettingzoo>=1.22,<2.0",
    "sensai-utils>=1.2.1,<2.0.0",
    "tensorboard>=2.5.0,<3.0.0",
    "torch>=2.0.0,<3.0.0,!=2.0.1,!=2.1.0",
    "tqdm",
    "virtualenv>=20.4.3,<21.0.0,!=20.4.5,!=20.4.6; sys_platform != 'win32'",
    "virtualenv<20.16.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
argparse = [
    "docstring-parser>=0.15,<0.16",
    "jsonargparse>=4.24.1,<5.0.0",
]
atari = [
    "ale-py>=0.8.1,<0.9.0",
    "autorom[accept-rom-license]>=0.4.2,<0.5.0",
    "opencv_python",
    "shimmy>=0.1.0,<1.0",
]
box2d = [
    "box2d_py==2.3.5",
    "pygame>=2.1.3",
    "swig==4.*",
]
classic-control = [
    "pygame>=2.1.3",
]
envpool = [
    "envpool>=0.8.2,<0.9.0; sys_platform != 'darwin'",
]
eval = [
    "docstring-parser>=0.15,<0.16",
    "joblib",
    "jsonargparse>=4.24.1,<5.0.0",
    "rliable==1.2.0",
    "scipy",
]
mujoco = [
    "imageio>=2.14.1",
    "mujoco>=2.1.5,<3",
]
mujoco-py = [
    "cython>=0.27.2",
    "mujoco-py>=2.1,<2.2",
]
pybullet = [
    "pybullet",
]
robotics = [
    "gymnasium-robotics",
]
vizdoom = [
    "vizdoom",
]
all = [
    "docstring-parser>=0.15,<0.16",
    "jsonargparse>=4.24.1,<5.0.0",
    "ale-py>=0.8.1,<0.9.0",
    "autorom[accept-rom-license]>=0.4.2,<0.5.0",
    "opencv_python",
    "shimmy>=0.1.0,<1.0",
    "box2d_py==2.3.5",
    "pygame>=2.1.3",
    "swig==4.*",
    "envpool>=0.8.2,<0.9.0; sys_platform != 'darwin'",
    "joblib",
    "rliable==1.2.0",
    "scipy",
    "imageio>=2.14.1",
    "mujoco>=2.1.5,<3",
    "cython>=0.27.2",
    "mujoco-py>=2.1,<2.2",
    "pybullet",
    "gymnasium-robotics",
    "vizdoom",
]

[project.urls]
Homepage = "https://github.com/thu-ml/tianshou"
Documentation = "https://tianshou.readthedocs.io"
"Bug Reports" = "https://github.com/thu-ml/tianshou/issues"
Source = "https://github.com/thu-ml/tianshou"

[tool.setuptools]
packages = ["tianshou"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
tianshou = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "tianshou.__version__"}
